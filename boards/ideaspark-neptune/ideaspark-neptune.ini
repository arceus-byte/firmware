
[env:ideaspark-neptune]
platform = ${env.platform}
framework = arduino
board = esp32dev

board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = custom_4Mb_full.csv

build_src_filter =
    ${env.build_src_filter}
    +<../boards/ideaspark-neptune>

build_flags =
    ${env.build_flags}
    ${env_4mb.build_flags}
    -Iboards/ideaspark-neptune
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DDEVICE_NAME='"IdeaSpark Neptune"'

lib_deps =
    ${env.lib_deps}

lib_ignore =
    ${env_4mb.lib_ignore}
